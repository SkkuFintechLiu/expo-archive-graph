<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>박람회의 기억 · 발표</title><style>
:root{--ink:#183c39;--deep:#123f3c;--paper:#f6f7ef;--red:#b65342;--green:#8db49c}*{box-sizing:border-box}body{margin:0;background:#dfe8df;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}.stage{height:100dvh;overflow:hidden;background:var(--paper);position:relative}.slide{display:none;height:100%;padding:3vh 5vw 8vh}.slide.active{display:flex;flex-direction:column;animation:enter .45s ease both}.slide.dark{background:var(--deep);color:#eff7ea}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}header{display:flex;justify-content:space-between;font-size:clamp(10px,.85vw,14px);letter-spacing:.14em;color:#778e80;border-bottom:1px solid #bdcec0;padding-bottom:1.6vh}h1{font-size:clamp(27px,3vw,50px);line-height:1.15;letter-spacing:-.04em;margin:2.2vh 0 .8vh}.sub{margin:0;color:#738c7c;font-size:clamp(14px,1.25vw,20px)}.body{flex:1;min-height:0;display:flex;align-items:center;gap:3vw}.visuals{flex:1.45;display:flex;align-items:center;gap:1vw;min-width:0}figure{margin:0;min-width:0;flex:1}figure img{display:block;width:100%;height:clamp(130px,39vh,410px);object-fit:contain;background:#e7eee5}figcaption{font-size:clamp(10px,.8vw,13px);color:#738a7b;margin-top:7px;line-height:1.35}figcaption a,.refs a{color:#24736a}.facts{flex:1;display:flex;flex-direction:column;gap:2vh}.fact{border-top:1px solid #a5bfb0;padding-top:1.5vh}.fact strong{display:block;color:var(--red);font-size:clamp(16px,1.5vw,24px)}.fact p{font-size:clamp(15px,1.25vw,21px);line-height:1.45;margin:.7vh 0}.dark .fact p{color:#f5f8ed}.build{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}.build.shown{opacity:1;transform:none}.timeline{width:100%;display:flex;position:relative;gap:2vw}.timeline:before{content:"";position:absolute;left:3%;right:3%;top:24px;height:2px;background:#abc9b7}.timecard{flex:1;position:relative;padding-top:45px}.timecard:before{content:"";position:absolute;top:17px;left:0;width:16px;height:16px;border-radius:50%;background:var(--red)}.timecard b{color:var(--red);font-size:clamp(16px,1.3vw,22px)}.timecard p{font-size:clamp(14px,1.1vw,19px)}.timecard figure img{height:clamp(110px,27vh,280px)}.refs{display:grid;grid-template-columns:1fr 1fr;gap:1vh 3vw;width:100%}.refs a{font-size:clamp(12px,1vw,16px);padding:.5vh 0;border-bottom:1px solid #d8e3d8}.graph-layout{width:100%;height:min(52vh,510px);display:grid;grid-template-columns: 1.65fr 1fr;gap:3vw;align-items:center}.graph-field{height:100%;position:relative;border:1px solid #668f7c55;background:radial-gradient(circle at 45% 50%,#245d50 0%,#123f3c 72%);overflow:hidden}.graph-field svg{position:absolute;inset:0;width:100%;height:100%}.graph-field line{stroke:#93bca5;stroke-opacity:.44;stroke-width:1.2;vector-effect:non-scaling-stroke}.graph-node{position:absolute;transform:translate(-50%,-50%);border:1px solid #adcfb6;background:#244e43;color:#e5f1e3;border-radius:999px;padding:8px 12px;font-size:clamp(10px,1vw,15px);white-space:nowrap;cursor:pointer;transition:transform .2s,background .2s}.graph-node:hover,.graph-node[aria-pressed="true"]{background:#d0e9cc;color:#173b34;transform:translate(-50%,-50%) scale(1.07)}.graph-node.primary{background:#b8dec0;color:#123a31;font-weight:700;padding:12px 16px}.graph-detail{border-left:2px solid #c9775d;padding-left:22px}.graph-detail small{color:#aacabb;letter-spacing:.13em}.graph-detail h2{color:#f5f8ee;font-size:clamp(21px,2vw,32px)}.graph-detail p{color:#c9ded0;line-height:1.65;font-size:clamp(14px,1.2vw,19px)}.graph-detail .disclaimer{font-size:12px;color:#9ebbad}.noimg .facts{max-width:85%}.cover .visuals{flex:1}.cover h1{font-size:clamp(36px,4vw,70px)}.cover .body{align-items:center}.cover figure img{height:clamp(130px,40vh,410px)}.footer{position:absolute;bottom:1.5vh;left:5vw;right:5vw;display:flex;align-items:center;gap:10px;font-size:13px;color:#597b6b}.footer button{border:1px solid #91ae9e;background:transparent;color:inherit;border-radius:3px;padding:6px 11px;cursor:pointer}.footer .spacer{flex:1}.progress{position:absolute;bottom:0;left:0;height:4px;background:#c66b52;transition:width .35s}.notes{display:none;position:fixed;z-index:10;right:2vw;top:3vh;width:min(520px,48vw);max-height:82vh;overflow:auto;background:#173d39;color:#f4f8ec;padding:25px;line-height:1.8;box-shadow:0 10px 40px #0006}.notes.open{display:block}.notes h2{font-size:18px}.sources{display:flex;flex-wrap:wrap;gap:12px}.sources a{color:#cbe1c7;font-size:12px}@media(max-width:700px){.graph-layout{height:auto;grid-template-columns:1fr}.graph-field{height:40vh}.graph-node{font-size:10px;padding:5px}.slide{padding:3vh 5vw 12vh}.body{display:block;overflow:auto}.visuals{margin-top:3vh}.visuals img{height:19vh}.facts{margin-top:2vh}.footer .hint{display:none}.notes{width:90vw}.timeline{gap:1vw}.timecard figure img{height:16vh}.refs{grid-template-columns:1fr}.cover .visuals img{height:20vh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" id="stage"></main><aside class="notes" id="notes"><h2>발표 원고</h2><p></p><div class="sources"></div></aside><nav class="footer"><button id="prev" aria-label="이전 단계">←</button><button id="next" aria-label="다음 단계">→</button><span id="count"></span><span class="spacer"></span><span class="hint">방향키 · 단계별 진행　 N 원고　 F 전체화면</span><button id="notesButton">발표 원고</button><button id="full">전체화면</button></nav><div class="progress" id="progress"></div><script>const data=[{"k": "발표 주제", "title": "박람회의 시간과\n다양한 시각을 기록하기", "sub": "가상 탐방에서 디지털 아카이브 구상으로", "kind": "cover", "sources": [], "notes": "안녕하세요. 오늘은 가상 탐방을 통해 저는 직접 방문할 수 없는 박람회의 회장과 전시를 살펴볼 수 있었습니다. 특히 인물의 동선을 따라 이동하는 방식이 인상적이었습니다. 회장의 구조를 이해할 수 있었고, 박람회가 열린 당시의 관람을 상상할 수도 있었습니다.", "visuals": [{"file": "user-1.jpg", "caption": "사용자가 제공한 일본 박람회 전시 포스터 · 원출처 미확인", "url": ""}, {"file": "user-4.jpg", "caption": "1970 수업 회장도 · 재구성 동선", "url": "https://canvas.skku.edu/courses/75818/files/11804731/download"}, {"file": "user-5.jpg", "caption": "2025 수업 회장도 · 재구성 동선", "url": "https://canvas.skku.edu/courses/75818/files/11865322/download#tour"}], "facts": [["가상 탐방", "인물의 동선을 따라 회장과 전시를 살펴보다"], ["인상", "당시의 관람을 상상하다"]]}, {"k": "01  가상 탐방", "title": "우리는 무엇을 보고 있는가?", "sub": "가상 인물의 동선으로 살펴본 박람회", "kind": "image", "image": "vr", "facts": [["관찰", "인물의 동선을 따라 회장과 전시를 탐방"], ["구분", "인물과 일부 대화는 자료를 바탕으로 재구성"], ["질문", "어떤 자료가 장면을 만들었는가?"]], "sources": [["2025 공식 360° 관람 안내", "https://www.expo2025.or.jp/en/vr_expo/"], ["1970 수업 가상 탐방 · 접근 권한 필요", "https://canvas.skku.edu/courses/75818/files/11804731/download"]], "notes": "하지만 탐방을 하면서 저는 우리가 보는 장면이 어떤 자료를 바탕으로 만들어졌는지도 생각하게 되었습니다. 가상 탐방 속 인물과 일부 대화는 자료를 바탕으로 재구성된 것입니다. 따라서 그 장면을 그대로 실제 관람객의 경험이라고 받아들일 수는 없습니다.", "visuals": [{"file": "user-2.jpg", "caption": "수업 자료 · 관람기 문장의 근거", "url": "https://canvas.skku.edu/courses/75818/files/11865322/download#src"}]}, {"k": "02  대한민국관", "title": "같은 전시, 서로 다른 기록", "sub": "기획 의도와 관람 경험을 구분하기", "kind": "compare", "facts": [["참여형 전시", "목소리 · 숨 · 영상"], ["서로 다른 반응", "한국 측 일부 기록 / 일본의 한 설문"]], "sources": [["대한민국관 전시 소개", "https://koreapavilion2025.kr/ko/pavilion/exhibition/"], ["수업 가상 탐방 · 자료와 질문", "https://canvas.skku.edu/courses/75818/files/11865322/download#src"], ["일본 설문 보도 · 250명", "https://news.livedoor.com/article/detail/28816037/"]], "notes": "특히 2025년 오사카·간사이 만국박람회의 대한민국관이 인상적이었습니다. 수업 자료에 따르면 관람객은 목소리와 숨, 영상 등을 통해 전시에 참여할 수 있었습니다. 또한 수업 자료는 대한민국관에 관한 서로 다른 기록을 함께 보여 주었습니다. 한국 측의 일부 자료는 대한민국관이 좋은 반응을 얻었다고 설명했습니다. 반면 일본의 한 설문에는 일부 관람객이 실망했다는 의견이 나타났습니다.", "visuals": [{"file": "korea-exhibition.jpg", "caption": "수업 자료에 인용된 한국관 가이드북 이미지", "url": "https://canvas.skku.edu/courses/75818/files/11865322/download#tour"}]}, {"k": "02  대한민국관", "title": "기록의 차이와 판단", "sub": "기획 의도와 관람 경험을 구분하기", "kind": "compare", "facts": [["질문", "같은 전시에 왜 서로 다른 기록이 남을까?"], ["확인", "누가 · 언제 · 어떤 목적으로 기록했는가?"]], "sources": [["대한민국관 전시 소개", "https://koreapavilion2025.kr/ko/pavilion/exhibition/"], ["수업 가상 탐방 · 자료와 질문", "https://canvas.skku.edu/courses/75818/files/11865322/download#src"], ["일본 설문 보도 · 250명", "https://news.livedoor.com/article/detail/28816037/"]], "notes": "이 자료를 보면서 저는 질문을 하게 되었습니다. 같은 전시를 보았는데, 왜 서로 다른 기록이 남을까? 그리고 우리는 무엇을 근거로 그 기록을 이해해야 할까? 어떤 기록은 전시를 기획한 사람의 의도를 중심으로 설명할 수 있습니다. 또 다른 기록은 관람객이 현장에서 느낀 점이나 불편했던 점을 중심으로 설명할 수 있습니다. 저는 이 차이를 볼 때 어느 한쪽을 바로 정답으로 선택하기보다, 누가, 언제, 어떤 목적으로 기록했는지 확인하는 것이 중요하다고 생각합니다. 그렇게 해야 각각의 자료가 무엇을 보여 주고, 무엇을 보여 주지 않는지 알 수 있기 때문입니다.", "visuals": [{"file": "user-3.jpg", "caption": "수업 자료 · 한국관 개념카드", "url": "https://canvas.skku.edu/courses/75818/files/11865322/download#tour"}]}, {"k": "03  보이지 않는 시각", "title": "관람객 밖의 목소리", "sub": "현재 탐방에서 충분히 찾지 못한 기록", "kind": "roles", "facts": [["설계자", "회장과 전시를 구상"], ["시공자", "공간을 건설"], ["현장 직원", "전시와 관람을 운영"], ["여러 나라의 관람객", "각자의 경험을 기록"]], "sources": [["수업 가상 탐방 · 기록 구성", "https://canvas.skku.edu/courses/75818/files/11865322/download#src"]], "notes": "가상 탐방에서 충분히 보이지 않았다고 느낀 부분도 있습니다. 제가 접한 자료는 주로 관람객의 동선을 중심으로 구성되어 있었습니다. 그러나 박람회에 참여한 사람은 관람객만이 아닙니다. 회장과 전시를 구상한 설계자도 있고, 그것을 실제로 건설한 시공자도 있습니다. 개막 후에는 현장 직원과 전시관 직원이 일합니다. 또한 여러 나라에서 온 관람객도 각자의 경험을 남깁니다. 저는 이러한 사람들의 기록을 더 살펴보고 싶습니다. 각자의 기록을 비교하면, 하나의 박람회를 더 다양한 각도에서 이해할 수 있을 것이라고 생각합니다.", "visuals": [{"file": "people-0.jpg", "caption": "사용자 제공 · 인물 사진, 원출처 미확인", "url": ""}, {"file": "user-6.jpg", "caption": "사용자 제공 · 현장 사진, 원출처 미확인", "url": ""}, {"file": "user-7.jpg", "caption": "사용자 제공 · 전시 현장 사진, 원출처 미확인", "url": ""}, {"file": "people-1.jpg", "caption": "사용자 제공 · 인도네시아관 행사 사진, 원출처 미확인", "url": ""}]}, {"k": "04  설계의 이념", "title": "1970 오사카 · 진보와 조화", "sub": "주제와 공간을 통해 살펴본 생각", "kind": "timeline", "facts": [["1970 오사카", "인류의 진보와 조화"], ["주제관", "지하 · 지상 · 공중 / 과거 · 현재 · 미래"]], "sources": [["태양의 탑 · 주제관 기획 과정", "https://taiyounotou-expo70.jp/en/about/okamoto-taro/"], ["아이치 · 회장 계획 답변", "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b151053.htm"], ["2025 회장 기본계획", "https://www.expo2025.or.jp/en/overview/masterplan/"]], "notes": "또 하나 관심을 갖게 된 것은 박람회가 만들어지는 과정입니다. 1970년 오사카 만국박람회의 주제는 ‘인류의 진보와 조화’였습니다. 주제관을 기획한 오카모토 다로는 지하, 지상, 공중의 공간을 통해 과거, 현재, 미래를 표현하고자 했습니다. 이를 통해 박람회가 미래를 설명하는 동시에, 예술과 공간을 통해 생명과 시간의 관계를 보여 주려고 했다는 점을 알 수 있었습니다.", "visuals": [{"file": "1970-reconstruction.jpg", "caption": "일본공업대학 · 태양의 탑 복원 영상", "url": "https://www.nit.ac.jp/topics/vr_project25"}, {"file": "request-image-1.jpg", "caption": "사용자 제공 · 태양의 탑 내부 이미지", "url": ""}]}, {"k": "04  설계의 이념", "title": "아이치와 오사카·간사이의 구상", "sub": "주제와 공간을 통해 살펴본 생각", "kind": "timeline", "facts": [["2005 아이치", "자연의 예지 · 회장과 생태환경"], ["2025 오사카·간사이", "생명이 빛나는 미래 사회 · 다양하면서도 하나"]], "sources": [["태양의 탑 · 주제관 기획 과정", "https://taiyounotou-expo70.jp/en/about/okamoto-taro/"], ["아이치 · 회장 계획 답변", "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b151053.htm"], ["2025 회장 기본계획", "https://www.expo2025.or.jp/en/overview/masterplan/"]], "notes": "2005년 아이치 만국박람회의 주제는 ‘자연의 예지’였습니다. 준비 과정에서는 가이쇼노모리의 생태환경과 회장 계획을 둘러싼 논의가 있었습니다. 박람회가 인간과 자연의 공존을 말한다면, 회장을 건설하는 과정에서 자연을 어떻게 대해야 하는지도 중요한 문제였습니다. 2025년 오사카·간사이 만국박람회는 ‘생명이 빛나는 미래 사회의 디자인’을 주제로 삼았습니다. 회장 기본계획에서는 ‘다양하면서도 하나’라는 이념 아래, 분산된 전시관과 고리 형태의 동선을 연결하고자 했습니다. 이 세 사례를 보며 저는 박람회의 디자인이 건물의 외형만을 결정하는 것이 아니라는 점을 생각하게 되었습니다. 그 안에는 인간과 자연, 생명과 미래에 관한 생각이 담겨 있습니다.", "visuals": [{"file": "request-image-2.jpg", "caption": "사용자 제공 · 아이치 박람회 마스코트", "url": ""}, {"file": "request-image-3.jpg", "caption": "사용자 제공 · 2025 박람회 마스코트", "url": ""}]}, {"title": "디자인에 담긴 생각", "sub": "인간 · 자연 · 생명 · 미래", "k": "아카이브 구상", "kind": "evidence", "facts": [["디자인", "건물의 외형을 넘어 생각을 담다"]], "notes": "이 세 사례를 보며 저는 박람회의 디자인이 건물의 외형만을 결정하는 것이 아니라는 점을 생각하게 되었습니다. 그 안에는 인간과 자연, 생명과 미래에 관한 생각이 담겨 있습니다.", "sources": [["2025 박람회협회 · 대지붕 링", "https://www.expo2025.or.jp/en/news/news-20250228-04/"]], "visuals": [{"file": "2025-grand-ring.jpg", "caption": "2025 박람회협회 · 대지붕 링", "url": "https://www.expo2025.or.jp/en/news/news-20250228-04/"}]}, {"title": "완성되기 전의 박람회", "sub": "구상과 논의, 건설 과정", "k": "아카이브 구상", "kind": "evidence", "facts": [["질문", "완성된 회장 이전에는 무엇이 있었을까?"]], "notes": "하지만 가상 탐방에서 볼 수 있는 것은 주로 완성된 회장의 모습입니다. 저는 완성되기 전의 구상과 논의, 건설 과정도 함께 보고 싶습니다.", "sources": [["2025 박람회협회 · 2024년 건설 중 회장", "https://www.expo2025.or.jp/en/news/news-20240530-01/"]], "visuals": [{"file": "ring-construction-2024.jpg", "caption": "2025 박람회협회 · 2024년 건설 중 회장", "url": "https://www.expo2025.or.jp/en/news/news-20240530-01/"}]}, {"title": "아카이빙 대상", "sub": "한 박람회의 전체 과정", "k": "아카이브 구상", "kind": "evidence", "facts": [["기획 · 설계", "처음의 구상"], ["건설 · 개막", "만들기와 경험"], ["폐막 후", "회장의 변화"]], "notes": "그래서 제가 앞으로 아카이빙하고 싶은 대상은 한 박람회의 전체 과정입니다. 저는 박람회가 열리는 기간뿐만 아니라, 처음 기획하고 설계하는 단계부터 건설, 개막 후의 전시와 관람, 그리고 폐막 후 회장의 변화까지 기록하고 싶습니다.", "sources": [["일본 중의원 · 2001년 회장 계획 답변", "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b151053.htm"]], "visuals": [{"file": "aichi-diet-response.jpg", "caption": "일본 중의원 · 2001년 회장 계획 답변", "url": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b151053.htm"}]}, {"title": "개막 전과 폐막 후", "sub": "계획과 건설에서 철거와 재이용까지", "k": "아카이브 구상", "kind": "evidence", "facts": [["개막 전", "계획 · 조사 · 의견 · 건설"], ["폐막 후", "철거 · 보존 · 용도 변화"]], "notes": "박람회가 열리는 동안에는 많은 사람이 전시관을 방문합니다. 하지만 박람회가 열리기 전에도 여러 사람이 계획을 세우고, 조사하고, 의견을 나누고, 건물을 만듭니다. 폐막 후에도 전시관은 철거되거나 보존될 수 있고, 회장의 용도도 바뀔 수 있습니다.", "sources": [], "visuals": [{"file": "aichi-environment.jpg", "caption": "일본 중의원 · 환경과 계획에 대한 답변", "url": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b151053.htm"}]}, {"title": "1970 오사카 · 시간에 따른 변화", "sub": "건설부터 개막, 그리고 오늘의 기념공원까지", "k": "아카이브 구상", "kind": "evidence", "facts": [["개막 전", "태양의 탑 건설"], ["1970년", "개막식과 회장"], ["오늘", "기념공원에 남은 태양의 탑"]], "notes": "이러한 과정까지 함께 기록해야 박람회의 모습을 더 폭넓게 이해할 수 있다고 생각합니다.", "sources": [["1970 사진 자료", "https://www.expo70-park.jp/cause/expo/"], ["현재의 태양의 탑", "https://www.expo70-park.jp/languages/english/tower-of-the-sun/"]], "visuals": [{"file": "1970-before.jpg", "caption": "만박기념공원 · 건설 중", "url": "https://www.expo70-park.jp/cause/expo/"}, {"file": "1970-opening.jpg", "caption": "만박기념공원 · 1970년 개막식", "url": "https://www.expo70-park.jp/cause/expo/"}, {"file": "1970-now.jpg", "caption": "만박기념공원 · 오늘의 태양의 탑", "url": "https://www.expo70-park.jp/languages/english/tower-of-the-sun/"}]}, {"title": "지도에서 시작하는 기록 터미널", "sub": "장소를 선택하고 시간에 따른 변화를 보기", "k": "아카이브 구상", "kind": "evidence", "facts": [["장소", "실제 회장 지도에서 선택"], ["시간", "설계 → 건설 → 개막 → 폐막 후"]], "notes": "저는 이를 위해 실제 회장 지도를 바탕으로 한 기록 터미널을 구상하고 있습니다. 이용자가 지도에서 한 장소를 선택하면, 먼저 그 장소의 시간에 따른 변화를 볼 수 있습니다. 예를 들어 설계 단계의 자료, 건설 과정의 사진, 개막 기간의 영상, 폐막 후의 기록을 순서대로 살펴볼 수 있습니다.", "sources": [["수업 자료 · 2025 회장도와 재구성 동선", "https://canvas.skku.edu/courses/75818/files/11865322/download#tour"]], "visuals": [{"file": "graph-prototype.jpg", "caption": "직접 제작한 기억 그래프 · 초기 시안", "url": "https://skkufintechliu.github.io/expo-archive-graph/"}]}, {"title": "다른 사람들의 목소리", "sub": "BIE · 박람회의 이야기를 미래로", "k": "아카이브 구상", "kind": "evidence", "facts": [["스위스관", "스위스 정부대표의 경험"], ["회장 운영", "이시카와 마사루의 회고 .sub)}</p><div class="body">${content}</div></section>`;stage.querySelectorAll('[data-graph]').forEach(b=>b.onclick=()=>{let item=window.graphNodes[Number(b.dataset.graph)];stage.querySelectorAll('[data-graph]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));stage.querySelector('#graph-title').textContent=item[0];stage.querySelector('#graph-description').textContent=item[3]});notes.querySelector('p').textContent=d.notes;notes.querySelector('.sources').innerHTML=(d.sources||[]).map(([a,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(a)} ↗</a>`).join('');step=0;update()}function update(){let els=[...stage.querySelectorAll('.build')];els.forEach((e,i)=>e.classList.toggle('shown',i<step));document.querySelector('#count').textContent=`${index+1} / ${data.length} · ${step}/${els.length}`;document.querySelector('#progress').style.width=((index+(els.length?step/els.length:1))/data.length*100)+'%';document.querySelector('#prev').disabled=index===0&&step===0}function next(){let n=stage.querySelectorAll('.build').length;if(step<n){step++;update()}else if(index<data.length-1){index++;render()}}function prev(){if(step>0){step--;update()}else if(index>0){index--;render();step=stage.querySelectorAll('.build').length;update()}}document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#notesButton').onclick=()=>notes.classList.toggle('open');document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();onkeydown=e=>{if(e.target.closest('[data-graph]')&&(e.key===' '||e.key==='Enter'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}if(e.key.toLowerCase()==='n')notes.classList.toggle('open');if(e.key.toLowerCase()==='f')document.querySelector('#full').click()};render();</script></body></html>
