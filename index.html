<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世博会记忆图谱</title><style>
:root{--ink:#e5f2ed;--muted:#97b0a9;--bg:#0c1819;--line:#496962;--accent:#aee4bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #29413d;padding:20px 5vw}header b{font-size:17px}header a,a{color:var(--accent)}main{max-width:1500px;margin:auto;padding:5vh 5vw}h1{font-size:clamp(34px,4.2vw,62px);letter-spacing:-.04em;margin:8px 0}h2{font-size:23px;margin:12px 0}p{line-height:1.7;color:var(--muted)}.kicker{color:#a7d8bf;letter-spacing:.18em;font-size:12px}.intro{max-width:750px;margin-bottom:30px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px}.panel{border:1px solid #2a4440;background:#102120;border-radius:12px}.canvas{position:relative;min-height:500px;overflow:hidden;background-image:radial-gradient(#45645d 1px,transparent 1px);background-size:25px 25px}.canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.canvas line{stroke:#557c70;stroke-width:1.5}.node{position:absolute;transform:translate(-50%,-50%);border:1px solid #669987;border-radius:40px;background:#18332e;color:#e4f4eb;padding:12px 18px;cursor:pointer;font-size:14px;white-space:nowrap}.node:hover,.node.active{background:#b7e2bf;color:#10251d;box-shadow:0 0 35px #8ed9ae55}.node[data-type="缺口"]{border-style:dashed;color:#e8c88e;background:#352c20}.legend{position:absolute;bottom:15px;left:20px;font-size:12px;color:#a3b9af}.info{padding:28px;display:flex;flex-direction:column}.type{color:#a6ddbb;font-size:12px;letter-spacing:.13em}.info p{font-size:15px}.source{margin-top:auto;border-top:1px solid #2c4941;padding-top:18px;font-size:13px;line-height:1.6}.foot{font-size:13px;margin-top:22px;color:#94aba2}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.buttons button{border:1px solid #476e60;background:transparent;color:#cde6d7;padding:9px 13px;border-radius:20px;cursor:pointer}.buttons button:hover{background:#26453b}@media(max-width:800px){.layout{grid-template-columns:1fr}.canvas{min-height:390px}.node{font-size:11px;padding:9px 11px}.info{min-height:240px}header{gap:20px}header a{font-size:13px}}
</style></head><body><header><b>EXPO / 记忆图谱</b><a href="presentation.html">打开课堂发表 →</a></header><main><div class="kicker">地点 × 时间 × 视角 × 资料</div><h1>一场世博会，<br>谁留下了记录？</h1><p class="intro">从 1970 年大阪、2005 年爱知到 2025 年大阪·关西。点击节点，比较不同年代的展览、场地与记录；资料仍在持续整理。</p><div class="layout"><div class="panel canvas" id="canvas" aria-label="互动知识图谱"><svg viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><line x1="500" y1="300" x2="210" y2="140"/><line x1="500" y1="300" x2="760" y2="130"/><line x1="500" y1="300" x2="800" y2="330"/><line x1="500" y1="300" x2="700" y2="500"/><line x1="500" y1="300" x2="265" y2="495"/><line x1="500" y1="300" x2="180" y2="320"/><line x1="500" y1="300" x2="470" y2="90"/><line x1="500" y1="300" x2="470" y2="530"/></svg><button class="node active" data-id="center" data-type="地点" style="left:50%;top:50%">2025 韩国馆</button><button class="node" data-id="official" data-type="资料" style="left:21%;top:23.3%">官方展馆指南</button><button class="node" data-id="report" data-type="资料" style="left:76%;top:21.7%">媒体观察</button><button class="node" data-id="vr" data-type="资料" style="left:80%;top:55%">官方 360° 浏览</button><button class="node" data-id="workers" data-type="缺口" style="left:70%;top:83.3%">工作人员 · 待寻找</button><button class="node" data-id="future" data-type="资料" style="left:26.5%;top:82.5%">闭幕后再利用</button><button class="node" data-id="visitors" data-type="缺口" style="left:18%;top:53.3%">游客记录 · 待筛选</button><button class="node" data-id="osaka1970" data-type="资料" style="left:47%;top:15%">1970 · 大阪</button><button class="node" data-id="aichi2005" data-type="资料" style="left:47%;top:88%">2005 · 爱知</button><div class="legend">● 已有资料　 ◌ 仍需寻找 / 核实</div></div><aside class="panel info"><div class="type" id="type"></div><h2 id="title"></h2><p id="description"></p><div class="source" id="source"></div></aside></div><div class="buttons"><button data-jump="official">从官方资料开始</button><button data-jump="report">比较一篇报道</button><button data-jump="workers">查看资料缺口</button></div><p class="foot">这是手工整理的学习用知识图谱原型，不是自动检索或完整的 GraphRAG 系统。节点连线表示档案研究关系，并不表示因果关系。资料仅供学习，公开再利用需另行确认权利。</p><p class="foot">设计参考：<a href="https://github.com/microsoft/graphrag/blob/main/docs/visualization_guide.md" target="_blank" rel="noopener">Microsoft GraphRAG 可视化指南</a> · <a href="https://github.com/kf600/KG_Visualization" target="_blank" rel="noopener">KG Visualization</a></p></main><script>
const data={osaka1970:{type:'1970 · 展示与观察',title:'未来如何被展示？',description:'太阳之塔与1970年大阪世博会的复原影像提供了一条观察入口。学习笔记提出：无线电话体验如何将技术变成可感知的未来？这是一项待核查的研究问题。',label:'日本工业大学：太阳之塔复原',url:'https://www.nit.ac.jp/topics/vr_project25'},aichi2005:{type:'2005 · 规划与环境',title:'谁参与设计未来？',description:'爱知世博会以自然的睿智为主题。海上之森的生态调查、市民讨论与规划调整值得保存；苍鹰发现不是会场调整的唯一原因。',label:'日本众议院：会场计划答辩',url:'https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b151053.htm'},center:{type:'地点 · 研究起点',title:'2025 韩国馆',description:'以韩国馆为试点，比较官方说明、报道与后续寻找的参与者记录。研究范围目前局限于已收集的少量资料。',label:'官方展馆指南 · 2024',url:'https://www.expo2025.or.jp/wp/wp-content/uploads/expo_leaflet_EN.pdf'},official:{type:'资料 A · 官方 / 2024',title:'官方展馆指南',description:'主办方发布的参展馆指南将韩国馆主题列为“With Hearts”。这是展前官方说明，不足以单独证明展馆开放后的完整情况。',label:'查看原始指南（PDF）',url:'https://www.expo2025.or.jp/wp/wp-content/uploads/expo_leaflet_EN.pdf'},report:{type:'资料 B · 媒体 / 2025',title:'一篇媒体观察',description:'媒体文章记录作者对韩国馆的观察和评价。它是一种具体视角，不能代表所有参观者，也不能仅凭评价判断事实全貌。',label:'阅读 The Korea Times 报道',url:'https://www.koreatimes.co.kr/amp/lifestyle/people-events/20250519/lights-but-no-clarity-inside-koreas-puzzling-pavilion-at-osaka-expo'},vr:{type:'资料 C · 官方',title:'360° 虚拟浏览',description:'官方浏览工具提供会场 360° 视角，并说明可通过视频游览展馆和设施。具体能查看哪些馆内内容，应逐一核实。',label:'查看官方使用说明',url:'https://www.expo2025.or.jp/en/vr_expo/'},workers:{type:'资料缺口 · 尚待寻找',title:'工作人员的视角',description:'设计、施工和运营人员的经历是本项目希望补充的视角。目前尚未收集到可核验的第一手材料，不预设他们的经历。',label:'下一步：查找机构访谈和制作记录'},future:{type:'背景资料 · 官方',title:'闭幕后再利用',description:'主办方介绍了场馆、材料及设备的再利用项目。这是整个世博会的项目说明，不能直接证明韩国馆的具体去向。',label:'查看主办方项目说明',url:'https://www.expo2025.or.jp/en/future-index/green/reuse-matching/'},visitors:{type:'资料缺口 · 待筛选',title:'不同游客的记录',description:'希望寻找本地和外国游客的游记、照片与访谈。先核实作者、参观日期和出处；个人体验不代表全部观众。',label:'下一步：寻找并确认资料使用条件'}};
function select(id){const x=data[id];document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n.dataset.id===id));document.getElementById('type').textContent=x.type;document.getElementById('title').textContent=x.title;document.getElementById('description').textContent=x.description;let e=document.getElementById('source');e.textContent='';if(x.url){let a=document.createElement('a');a.href=x.url;a.textContent=x.label+' ↗';a.target='_blank';a.rel='noopener';e.append(a)}else e.textContent=x.label}document.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>select(n.dataset.id)));document.querySelectorAll('[data-jump]').forEach(n=>n.onclick=()=>select(n.dataset.jump));select('center');
</script></body></html>
